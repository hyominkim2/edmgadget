<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>EDM GADGET — 지능형 데이터센터 전력 최적화</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="EDM GADGET의 AI 기반 솔루션으로 데이터센터의 PUE를 개선하고 운영 비용을 획기적으로 절감하세요.">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #2b3a55;
      --accent-dark: #1e2a40;
      --text: #121417;
      --muted: #5d6672;
      --line: #e9eef3;
      --bg-light: #f9fbfd;
      --radius: 12px;
      --maxw: 980px;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: var(--text);
      font-family: 'Poppins', 'Noto Sans KR', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    /* Header (Sticky) */
    header {
      padding: 20px 20px; 
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
      transition: box-shadow 0.2s ease;
    }
    header:hover {
      box-shadow: var(--shadow);
    }
    .header-inner {
      width: min(94%, var(--maxw));
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo {
      width: 120px; 
      height: 120px;
      object-fit: contain;
    }
    .brand {
      display: none; 
    }

    /* Hero (Impact) */
    .hero {
      width: min(90%, var(--maxw));
      margin: 0 auto;
      padding: 64px 0 72px;
      text-align: center;
    }
    .title {
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 700;
      line-height: 1.35; /* 라인 높이 미세 조정 */
      margin: 0 0 16px;
      color: var(--brand);
    }
    .subtitle {
      margin: 0 auto 32px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
      max-width: 720px;
    }
    
    /* LinkedIn Button */
    .cta-button {
      display: inline-block;
      background-color: var(--brand);
      color: #fff;
      padding: 14px 32px;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(43, 58, 85, 0.2); 
    }
    .cta-button:hover {
      background-color: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(43, 58, 85, 0.25);
    }

    /* Content Area */
    .content-wrapper {
      background: var(--bg-light);
      padding: 72px 0;
      border-top: 1px solid var(--line);
    }
    
    .section-heading {
      font-size: 28px;
      font-weight: 600;
      color: var(--brand);
      text-align: center;
      margin: 0 0 32px;
    }
    
    .image-container {
      width: min(94%, var(--maxw));
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      transition: box-shadow 0.3s ease;
    }
    .image-container:hover {
      box-shadow: var(--shadow-hover);
    }
    .image-container img {
      width: 100%;
      display: block;
      border-radius: 8px;
      user-select: none;
      -webkit-user-drag: none;
    }
    .image-container img + img { margin-top: 16px; }

    /* Footer */
    footer {
      border-top: 1px solid var(--line);
      padding: 32px 18px 40px;
      color: #8a95a3;
      font-size: 14px;
      text-align: center;
      background: #fff;
    }

    @media (max-width: 600px) {
      .logo {
        width: 65px; 
        height: 65px; 
      }
      .brand { font-size: 18px; }
      .title { font-size: 30px; }
      .subtitle { font-size: 16px; }
      .hero { padding: 48px 0 56px; }
      .content-wrapper { padding: 56px 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <img src="logo.png" alt="EDM GADGET 로고" class="logo" />
      <p class="brand">EDM GADGET</p>
    </div>
  </header>

  <section class="hero">
    <h1 class="title">AI로 데이터센터의 에너지 효율을 재설계하다.</h1>
    <p class="subtitle">
        이디엠가젯의 AI 제어 기술로 전력·부하·냉각을 통합 최적화합니다.<br>
        스마트한 에너지 제어 설계를 통해 PUE를 개선하고, 운영 비용을 혁신적으로 절감하세요.<br>
    </p>
    <a href="https://www.linkedin.com/company/edm-gadget/" class="cta-button" target="_blank" rel="noopener noreferrer">
      LinkedIn에서 더 알아보기
    </a>
  </section>

  <div class="content-wrapper">
    <h2 class="section-heading">The Visionaries & The Technology</h2> <main class="image-container">
      <img src="team_intro_page1.jpeg" alt="EDM GADGET — 솔루션 소개 1페이지" loading="eager" decoding="async">
      <img src="team_intro_page2.jpeg" alt="EDM GADGET — 솔루션 소개 2페이지" loading="lazy" decoding="async">
    </main>
  </div>

  <footer>
    © 2025 EDM GADGET. All rights reserved.
  </footer>

  <script>
    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('dragstart', e => e.preventDefault());
      img.addEventListener('contextmenu', e => e.preventDefault());
    });
  </script>

</body>
</html>
